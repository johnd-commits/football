<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HardWorkIQ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101b23">
<meta name="description" content="HardWorkIQ — learn your team's plays by tracing them with a finger.">
<title>HardWorkIQ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/hardworkiq.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --turf:#2f6b46; --turf-dark:#27593b;
    --chalk:#f1f4ee; --ink:#0a1628; --ink-2:#122038; --ink-3:#1c3150;
    --line:#365467; --muted:#93a9b7;
    --marker:#f2c230; --pass:#4fd189; --fail:#f2705e; --answer:#5fb0f0;
    --navy:#0a1628; --gold:#f2c230;
    --dock-w:404px;
    --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:var(--ink); color:var(--chalk); font-family:var(--font);
    font-size:15px; line-height:1.4; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}

  header{
    display:flex;align-items:center;gap:8px;padding:10px 12px;
    border-bottom:1px solid var(--line);flex:none;position:relative;z-index:8;min-height:56px;
  }
  header .title{flex:1;min-width:0;max-width:none}
  header .title b{display:block;font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .title span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #back{
    flex:none;min-width:58px;min-height:44px;padding:0 10px;font-size:14px;
  }
  .tabs{
    display:flex;gap:6px;background:var(--ink-2);padding:5px;border-radius:14px;
    flex:none;margin-left:auto;min-width:0;
  }
  .tabs button{
    border:0;background:none;color:var(--muted);font:inherit;font-weight:750;font-size:14px;
    padding:10px 12px;border-radius:10px;cursor:pointer;min-height:44px;min-width:0;
  }
  .tabs button[aria-selected="true"]{background:var(--marker);color:#2a2109}
  .streak{
    flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;
    background:var(--ink-2);border:1px solid var(--line);border-radius:10px;
    padding:5px 10px;color:var(--chalk);cursor:pointer;min-height:44px;
  }
  .streak[hidden]{display:none !important}
  .streak b{font-size:13px;color:var(--marker)}
  .streak span{font-size:10px;color:var(--muted);font-weight:700}
  .study-tools{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;align-items:center}
  .study-tools input[type=search]{
    flex:1 1 140px;min-width:120px;margin:0;padding:10px 12px;border-radius:9px;
    background:var(--ink);border:1px solid var(--line);color:var(--chalk);font:inherit;
  }
  .nav-plays{display:flex;gap:6px;margin:0 0 8px}
  .nav-plays .btn{flex:1}
  .kbd-hint{font-size:11px;color:var(--muted);margin:4px 0 0}
  .quiz-card{
    background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px;margin:8px 0;
  }
  .quiz-card .opts{display:grid;gap:8px;margin-top:10px}
  #field-badge{
    position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:5;
    background:rgba(16,27,35,.88);border:1px solid var(--line);color:var(--chalk);
    font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;pointer-events:none;
    display:none;white-space:nowrap;
  }
  #field-badge.on{display:block}
  .side-toggle{display:flex;gap:6px;margin:0 0 8px}
  .side-toggle .chip{flex:1;text-align:center}

  #fieldwrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:6px;overflow:hidden;touch-action:none}
  svg#field{width:100%;height:100%;touch-action:none;display:block}
  #view3d{
    display:none;position:absolute;inset:0;width:100%;height:100%;
    touch-action:none;background:#101b23;
  }
  body.view-3d svg#field{visibility:hidden;pointer-events:none}
  body.view-3d #view3d{display:block}
  body.view-3d #fieldwrap{flex:1;min-height:0;padding:0}
  body.view-3d #dock{flex:none;max-height:22vh;padding:8px 10px 10px;overflow-y:auto}
  #hud{
    display:none;position:absolute;inset:0;z-index:6;pointer-events:none;
  }
  body.view-3d #hud:not([hidden]){display:block}
  #hud .speed{
    position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
    display:flex;align-items:center;gap:4px;pointer-events:auto;
    color:#f2705e;font-weight:800;font-size:16px;letter-spacing:.04em;
    text-shadow:0 1px 4px #101b23;white-space:nowrap;
  }
  #hud .speed button{
    background:transparent;border:0;color:inherit;font:inherit;font-weight:800;
    cursor:pointer;padding:6px 7px;opacity:.45;min-width:28px;
  }
  #hud .speed button[aria-pressed="true"]{opacity:1;color:#f2c230}
  #hud .call{
    position:absolute;left:50%;top:14px;transform:translateX(-50%);
    pointer-events:none;text-align:center;max-width:min(78vw, 820px);z-index:1;
  }
  #hud .call b{
    display:block;font-size:clamp(28px, 4.6vw, 52px);font-weight:800;line-height:1.05;
    color:#f2c230;letter-spacing:-.03em;
    text-shadow:0 2px 14px #101b23, 0 0 3px #101b23;
  }
  #hud .call span{
    display:block;margin-top:6px;font-size:clamp(13px, 1.6vw, 18px);font-weight:650;
    color:#f1f4ee;text-shadow:0 1px 8px #101b23;
    max-height:2.6em;overflow:hidden;
  }
  #recenter{
    display:none;position:absolute;right:12px;bottom:12px;z-index:6;
    width:52px;height:52px;border-radius:50%;padding:0;min-width:0;min-height:0;
    font-size:11px;font-weight:800;letter-spacing:.02em;
  }
  body.view-3d #recenter:not([hidden]){display:grid;place-items:center}
  #zoom{
    position:absolute;left:12px;bottom:12px;z-index:6;
    display:flex;flex-direction:column;gap:6px;pointer-events:none;
  }
  #zoom .btn{
    pointer-events:auto;flex:none;min-width:92px;min-height:44px;padding:0 12px;
    font-size:13px;font-weight:800;
  }
  body.view-3d #zoom{bottom:12px}
  #viewmode{
    position:absolute;right:10px;top:10px;z-index:6;pointer-events:none;
  }
  #viewmode[hidden]{display:none !important}
  #viewmode .chips{margin:0;padding:0;overflow:visible;pointer-events:auto;justify-content:flex-end}
  #viewmode .chip{
    background:rgba(16,27,35,.88);padding:7px 11px;font-size:12px;font-weight:800;
  }

  #split{display:none}
  #dock{flex:none;border-top:1px solid var(--line);background:var(--ink-2);padding:8px 12px 12px;max-height:42vh;overflow-y:auto}
  #dock.slim{max-height:none;overflow:visible;padding:4px 12px 10px}
  #dock.slim .you{margin-bottom:4px}
  #dock.slim .bar{margin-top:6px}
  #dock.slim .chips{margin-bottom:4px}
  #dock .dock-more{display:none}
  #dock.expanded .dock-more{display:block}
  .dock-handle{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;min-height:28px;margin:0 0 6px;border:0;padding:4px 0 2px;
    background:transparent;cursor:pointer;color:var(--muted);font:inherit;font-size:12px;font-weight:700;
  }
  .dock-handle::before{
    content:"";display:block;width:42px;height:5px;border-radius:99px;background:var(--line);
  }
  body.play-on header{padding:8px 12px}
  body.play-on header .title span{display:none}
  body.play-on #dock{max-height:none;padding:4px 12px 10px}
  body.play-on #dock.slim{padding-bottom:8px}
  body.play-on #fieldwrap{min-height:0}
  .banner{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .verdict{font-size:26px;font-weight:800;letter-spacing:.02em;padding:2px 14px;border-radius:8px;flex:none}
  .verdict.pass{background:var(--pass);color:#08301c}
  .verdict.fail{background:var(--fail);color:#3a0f08}
  .verdict.help{background:var(--marker);color:#33270a;font-size:18px}
  .banner .why{font-size:14.5px}
  .banner .why small{display:block;color:var(--muted);font-size:12.5px}
  .cue{font-size:15.5px;min-height:22px}
  .cue b{color:var(--marker)}

  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  button.btn{
    flex:1 1 auto;min-width:90px;min-height:46px;font:inherit;font-size:15px;font-weight:650;
    background:var(--ink-3);color:var(--chalk);border:1px solid var(--line);border-radius:10px;cursor:pointer;padding:0 14px;
  }
  button.btn:active{transform:translateY(1px)}
  button.btn.go{background:var(--marker);color:#2a2109;border-color:var(--marker)}
  button.btn.ghost{flex:0 0 auto;min-width:0;background:transparent}
  button.btn.warn{color:var(--fail)}
  button.btn:disabled{opacity:.35}
  button.btn[aria-pressed="true"]{background:var(--marker);color:#2a2109;border-color:var(--marker)}
  button:focus-visible{outline:2px solid var(--marker);outline-offset:2px}

  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin:0 0 8px}
  .chip{
    flex:none;padding:8px 13px;border-radius:999px;background:var(--ink-3);border:1px solid var(--line);
    font:inherit;font-size:14px;font-weight:600;color:var(--chalk);cursor:pointer;white-space:nowrap;
  }
  .chip[aria-pressed="true"]{background:var(--marker);color:#2a2109;border-color:var(--marker)}

  h3.sec{font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 7px}
  ul.list{list-style:none;margin:0;padding:0}
  ul.list li{
    display:flex;align-items:center;gap:11px;padding:11px 12px;margin-bottom:6px;
    background:var(--ink);border:1px solid transparent;border-radius:10px;cursor:pointer;
  }
  ul.list li[aria-current="true"]{border-color:var(--marker)}
  ul.list .nm{flex:1;font-weight:550;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--ink-3);color:var(--muted);flex:none}
  .pill.on{background:var(--pass);color:#08301c}
  .pill.part{background:var(--marker);color:#2a2109}
  .box{width:22px;height:22px;flex:none;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--ink)}
  .box.on{background:var(--marker);border-color:var(--marker)}
  input[type=text],textarea{
    width:100%;padding:11px 12px;border-radius:9px;background:var(--ink);border:1px solid var(--line);
    color:var(--chalk);font:inherit;font-size:15px;margin-bottom:8px;
  }
  textarea{min-height:104px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  p.hint{color:var(--muted);font-size:13.5px;margin:6px 0}
  input[type=range]{width:100%;accent-color:var(--marker);margin:2px 0 10px}
  .pulse{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.2}50%{opacity:.95}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.65}}
  #gate{
    position:fixed;inset:0;z-index:40;background:var(--navy);
    padding:max(14px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  #gate.landing{
    display:flex;flex-direction:column;align-items:center;
    background:
      radial-gradient(ellipse 80% 55% at 50% 28%, #163056 0%, var(--navy) 70%),
      var(--navy);
  }
  #gate > .btn.ghost:first-child{align-self:flex-start;margin-bottom:4px}
  #gate .hero{
    display:block;width:min(100%, 380px);height:auto;margin:4px auto 10px;
    filter:drop-shadow(0 10px 28px rgba(0,0,0,.45));
  }
  #gate .brand-strip{
    display:block;width:min(100%, 340px);height:auto;margin:2px auto 12px;
  }
  #gate .panel{
    width:min(100%, 440px);margin:0 auto;
    background:rgba(10,22,40,.78);border:1px solid rgba(54,84,103,.85);
    border-radius:14px;padding:14px 14px 16px;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  #gate.landing .panel{margin-top:auto}
  #gate h2{font-size:28px;margin:6px 0 6px}
  #gate .lead{color:var(--muted);margin:0 0 14px;font-size:15.5px}
  #gate .posgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 8px}
  #gate .posgrid button{min-height:54px;width:100%}
  #gate .stack{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
  #gate .stack button{width:100%}
  header .brand-mark{
    display:none;height:36px;width:auto;max-width:min(42vw, 200px);
    object-fit:contain;flex:none;position:relative;z-index:1;
  }
  body.brand-on header .brand-mark{display:block}
  body.brand-on header .title{display:none}
  @media (max-width:899px){
    header{
      display:grid;
      grid-template-columns:auto 1fr auto;
      grid-template-areas:"back tabs tabs" "title title account";
      align-items:center;gap:6px 8px;padding:8px 10px;min-height:0;
    }
    #back{grid-area:back;min-width:52px;padding:0 8px}
    .tabs{
      grid-area:tabs;margin-left:0;width:100%;justify-content:stretch;
      gap:3px;padding:4px;
    }
    .tabs button{flex:1;padding:8px 6px;font-size:13px;min-height:40px}
    header .title{grid-area:title;max-width:none}
    header .title b{font-size:17px}
    header .title span{display:none}
    .account-wrap{grid-area:account}
    header .brand-mark{grid-area:title;height:30px;max-width:min(38vw, 150px)}
    #zoom .btn{min-width:72px;min-height:40px;font-size:12px;padding:0 8px}
  }
  .account{
    flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;
    background:var(--ink-2);border:1px solid var(--line);border-radius:10px;
    padding:5px 10px;color:var(--chalk);cursor:pointer;min-height:44px;margin-left:8px;
  }
  .account b{font-size:13px;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .account span{font-size:11px;color:var(--marker);font-weight:800}
  .account-wrap{display:flex;align-items:center;gap:6px;flex:none;margin-left:8px}
  .account-wrap[hidden]{display:none !important}
  #signout{
    flex:none;min-width:0;min-height:44px;padding:0 12px;font-size:13px;font-weight:750;
  }
  @media (max-width:899px){
    .account-wrap{grid-area:account;margin-left:0}
    .account{margin-left:0}
    #signout{padding:0 10px;font-size:12px;min-height:40px}
  }
  #toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(16px);
    background:var(--marker);color:#2a2109;font-weight:800;padding:10px 16px;
    border-radius:999px;z-index:70;opacity:0;pointer-events:none;transition:.22s ease;
    white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .you{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .you b{flex:1;min-width:0}
  .you .btn{flex:0 0 auto;min-width:0;min-height:40px;padding:0 12px}
  .you .btn.change-play{
    max-width:min(58vw, 240px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  #play-menu, #board-menu{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end;
    background:rgba(8,14,18,.55);padding:0;
  }
  #board-menu{z-index:55}
  #play-menu .sheet, #board-menu .sheet{
    display:flex;flex-direction:column;min-height:42vh;max-height:min(80vh, 720px);
    max-height:min(80dvh, 720px);width:100%;
    background:var(--ink);border:1px solid var(--line);border-bottom:0;
    border-radius:16px 16px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.45);
    overflow:hidden;padding-bottom:env(safe-area-inset-bottom);
  }
  #play-menu .sheet-head, #board-menu .sheet-head{
    flex:none;display:flex;align-items:center;gap:10px;padding:12px 12px 8px;
    border-bottom:1px solid var(--line);
  }
  #play-menu .sheet-head b, #board-menu .sheet-head b{flex:1;font-size:16px}
  #play-menu .sheet-close, #board-menu .sheet-close{
    flex:none;border:0;background:var(--ink-3);color:var(--chalk);font:inherit;
    font-size:14px;font-weight:700;border-radius:9px;padding:8px 12px;min-height:40px;cursor:pointer;
  }
  #play-menu .plist, #board-menu .plist{
    flex:1 1 auto;min-height:0;overflow-y:scroll;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;touch-action:pan-y;padding:4px 0 12px;
  }
  #play-menu .grp{
    position:sticky;top:0;z-index:1;padding:10px 16px 4px;
    font-size:11px;font-weight:800;letter-spacing:.02em;
    color:var(--muted);background:var(--ink);
  }
  #play-menu .play, #board-menu .play{
    display:block;width:100%;border:0;background:transparent;color:var(--chalk);
    font:inherit;font-size:16px;font-weight:650;text-align:left;padding:12px 16px;
    min-height:48px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #play-menu .play[aria-current="true"], #board-menu .play[aria-current="true"]{background:var(--marker);color:#2a2109}
  #board-menu .play{display:flex;justify-content:space-between;align-items:center;gap:10px}
  #board-menu .play span{color:var(--muted);font-size:13px;font-weight:700}
  @media (min-width:900px){
    body{flex-direction:row}
    header{position:fixed;top:0;left:0;right:calc(var(--dock-w) + 10px);z-index:8;background:var(--ink)}
    header .title{max-width:none}
    #fieldwrap{flex:1;padding-top:76px;min-height:0;min-width:0}
    #viewmode{top:86px}
    #split{
      display:block;width:10px;flex:none;align-self:stretch;cursor:col-resize;
      position:relative;z-index:7;background:var(--ink);touch-action:none;border:0;padding:0;
    }
    #split::before{
      content:"";position:absolute;top:50%;left:3px;width:4px;height:56px;margin-top:-28px;
      border-radius:99px;background:var(--line);
    }
    #split:hover::before, #split:focus-visible::before, body.resizing #split::before{
      background:var(--marker);
    }
    body.resizing, body.resizing *{cursor:col-resize !important;user-select:none}
    #dock{width:var(--dock-w);flex:none;max-height:none;overflow-y:auto;border-top:0;border-left:1px solid var(--line);padding-top:14px;min-width:0}
    body.mode-study #dock, body.mode-progress #dock, body.mode-coach #dock{padding-top:12px}
    body.mode-study #dock .study-tools{margin-bottom:10px}
    body.mode-study #fieldwrap{padding-left:4px}
    .tabs button{font-size:13px;padding:10px 10px;min-width:0}
    #dock.slim{max-height:none;overflow-y:auto;padding-top:14px}
    #dock .dock-more, #dock.expanded .dock-more{display:block}
    .dock-handle{display:none}
    body.view-3d header{right:0}
    body.view-3d #fieldwrap{padding-top:72px}
    body.view-3d #hud .call{top:80px}
    body.view-3d #dock{width:100%;max-height:22vh;border-left:0;border-top:1px solid var(--line)}
    body.view-3d #split{display:none}
    body.view-3d{flex-direction:column}
    body.play-on header{position:fixed;padding:8px 12px}
    body.play-on header .title span{display:block}
    #play-menu, #board-menu{align-items:center;justify-content:center;padding:32px}
    #play-menu .sheet, #board-menu .sheet{
      width:min(440px, 100%);min-height:240px;max-height:min(72vh, 640px);
      border-radius:14px;border:1px solid var(--line);padding-bottom:0;
    }
  }
</style>
</head>
<body>
<header>
  <button id="back" class="btn ghost" type="button">Back</button>
  <img class="brand-mark" src="brand/logo-horiz-sm.png" alt="Malden Catholic Lancers Football" width="199" height="96" decoding="async">
  <div class="title"><b id="ttl">HardWorkIQ</b><span id="sub">Hard work shows up on the field.</span></div>
  <div class="tabs" role="tablist">
    <button role="tab" data-mode="practice">Practice</button>
    <button role="tab" data-mode="study">Study</button>
    <button role="tab" data-mode="plays">Plays</button>
    <button role="tab" data-mode="progress">Stats</button>

/* ---------------- path maths ---------------- */
function plen(p) { let t = 0; for (let i = 1; i < p.length; i++) t += dist(p[i - 1], p[i]); return t; }

function resample(pts, n) {
  if (!pts || !pts.length) return Array.from({ length: n }, () => ({ x: 0, y: 0 }));
  if (pts.length === 1) return Array.from({ length: n }, () => ({ ...pts[0] }));
  const segs = []; let total = 0;
  for (let i = 1; i < pts.length; i++) { const d = dist(pts[i - 1], pts[i]); segs.push(d); total += d; }
  if (!total) return Array.from({ length: n }, () => ({ ...pts[0] }));
  const out = [], step = total / (n - 1);
  let si = 0, acc = 0;
  for (let k = 0; k < n; k++) {
    const tgt = step * k;
    while (si < segs.length - 1 && acc + segs[si] < tgt) { acc += segs[si]; si++; }
    const t = segs[si] ? (tgt - acc) / segs[si] : 0;
    out.push({ x: pts[si].x + (pts[si + 1].x - pts[si].x) * t,
               y: pts[si].y + (pts[si + 1].y - pts[si].y) * t });
  }
  return out;
}

// shortest distance from a point to a polyline, and how far along it that lands (0..1)
function nearestOn(pt, path) {
  let best = { d: Infinity, t: 0 };
  const total = plen(path) || 1;
  let acc = 0;
  for (let i = 0; i < path.length - 1; i++) {
    const a = path[i], b = path[i + 1];
    const vx = b.x - a.x, vy = b.y - a.y, L2 = vx * vx + vy * vy, len = Math.sqrt(L2);
    const t = L2 ? clamp(((pt.x - a.x) * vx + (pt.y - a.y) * vy) / L2, 0, 1) : 0;
    const d = Math.hypot(pt.x - (a.x + vx * t), pt.y - (a.y + vy * t));
    if (d < best.d) best = { d: d, t: (acc + len * t) / total };
    acc += len;
  }
  return best;
}

/* --------------- grading one finger drag --------------- */
function judge(trail, target, tol) {
  if (!trail || trail.length < 2 || plen(trail) < 14)
    return { pass: false, why: 'Nothing was run', progress: 0, coverage: 0, worst: 0 };
  const marks = resample(target, 40);
  let worst = 0;
  for (let i = 0; i < trail.length; i++) {
    const d = nearestOn(trail[i], target).d;
    if (d > worst) worst = d;
  }
  const covered = marks.filter(s => trail.some(p => dist(p, s) <= tol * 1.15)).length;
  const coverage = covered / marks.length;
  const last = trail[trail.length - 1];
  const endDev = dist(last, target[target.length - 1]);
  const progress = clamp(nearestOn(last, target).t, 0, 1);
  const finished = endDev <= tol * 1.25 || (progress >= 0.97 && endDev <= tol * 1.6);
  const pass = finished && coverage >= 0.88 && worst <= tol * 2.1;

  let why = 'Route run clean';
  if (!pass) {
    if (worst > tol * 1.6) why = 'Drifted too far off the path';
    else if (!finished) why = progress < 0.7 ? 'Stopped short of the finish' : 'Did not quite finish it';
    else why = 'Cut a corner on the way';
  }
  return { pass: pass, why: why, progress: progress, coverage: coverage, worst: worst, endDev: endDev };
}

// plain-English route description, used by the first hint
function describe(pts, startX, isDef) {
  const s = pts[0], e = pts[pts.length - 1];
  const depth = Math.round((s.y - Math.min.apply(null, pts.map(p => p.y))) / YARD);
  const drift = e.x - s.x;
  const inward = (startX > W / 2 && drift < 0) || (startX < W / 2 && drift > 0);
  const side = Math.abs(drift) < 1.5 * YARD ? 'straight ahead'
             : inward ? 'in toward the middle' : 'out toward the sideline';
  if (isDef) {
    if (e.y > s.y + YARD) return 'Comes downhill at the ball, ' + side + '.';
    if (depth < 2) return 'Holds his level and works ' + side + '.';
    return 'Drops about ' + depth + ' yards, then works ' + side + '.';
  }
  if (depth < 2) return 'Stays shallow and runs ' + side + '.';
  if (Math.abs(drift) < 1.5 * YARD) return 'Runs about ' + depth + ' yards straight downfield.';
  return 'Gets about ' + depth + ' yards deep, then breaks ' + side + '.';
}

function mkMC(name, type, notes, form, spec) {
  spec = spec || {};
  const rushers = spec.rushers || DL;
  const def = d425(form).map(function (p) {

    const route = steps && steps.length

    return { id: p.id, label: p.label, x: p.x, y: p.y, side: 'def',
      block: rushers.indexOf(p.id) >= 0, route: route };
  });
  return { id: uid(), name: name, type: type, notes: notes, side: 'def',
    folder: FOLDER_MC, players: def.concat(scoutForm(form)) };

let S = boot();
function boot() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) { saved = null; }
  const ok = saved && Array.isArray(saved.plays) && saved.plays.length;
  const posOk = saved && POSITIONS.some(p => p.id === saved.pos);
  const plays = ensureTeamPacks(ok ? saved.plays : starters());
  const base = {
    plays: plays,
    currentId: saved && saved.currentId,
    stats: (saved && saved.stats) || {},
    tol: (saved && saved.tol) || 3,
    pos: posOk ? saved.pos : null
  };
  if (!base.currentId || !plays.some(p => p.id === base.currentId))
    base.currentId = plays[0] ? plays[0].id : null;
  const pos = POSITIONS.find(p => p.id === base.pos);
  return Object.assign({ mode: 'practice', tool: 'move', sel: null, armed: null,
    sess: null, pane: 'list', style: 'guided', pick: null, loadMsg: '',

  field.append(defs);

  worldG = sv('g');

  const g = sv('g');

  for (let y = (LOS % 180) - 180; y < H; y += 180)
    g.append(sv('rect', { x: 0, y: y, width: W, height: 90, fill: 'var(--turf-dark)', opacity: .4 }));

        'font-size': 20, 'font-weight': 600, class: 'yd' });

function atPath(path, t) {
  if (!path || !path.length) return null;
  if (path.length === 1 || t <= 0) return { x: path[0].x, y: path[0].y };
  const pts = path.length > 8 ? path : resample(path, 48);
  const i = clamp(t * (pts.length - 1), 0, pts.length - 1);
  const lo = Math.floor(i), hi = Math.min(pts.length - 1, Math.ceil(i)), u = i - lo;
  return { x: pts[lo].x + (pts[hi].x - pts[lo].x) * u, y: pts[lo].y + (pts[hi].y - pts[lo].y) * u };
}

function camPlayer(play) {
  const mine = play.players.find(p => isMyPlayer(p));
  if (mine) return mine;
  const pos = currentPos();
  const side = pos ? pos.side : null;
  if (side) {
    const mate = play.players.find(p => p.side === side && !p.scout);
    if (mate) return mate;
    if (side === 'def') return { x: 450, y: 788, side: 'def', id: '__you', label: pos.labels[0] };
    return { x: 450, y: 940, side: 'off', id: '__you', label: pos.labels[0] };
  }
  return play.players.find(p => !p.scout) || play.players[0];
}
function lookTarget(me) {
  const lookX = W / 2;
  const lookZ = me.side === 'def' ? LOS + 5 * YARD : LOS - 10 * YARD;
  const steep = clamp((-clampPitch(eye.pitch) - 0.2) / 1.25, 0, 1);
  const ax0 = me.x + (lookX - me.x) * 0.2 + (eye.tx || 0);
  const az0 = me.y + (lookZ - me.y) * 0.4 + (eye.ty || 0);
  const midZ = LOS - 7 * YARD;
  return {
    ax: clamp(ax0 + (lookX - ax0) * steep * 0.6, 40, W - 40),
    az: clamp(az0 + (midZ - az0) * steep * 0.75, 40, H - 40),
    yaw0: me.side === 'def' ? 0 : Math.PI

}
function clampPitch(p) { return clamp(p, -1.52, -0.16); }
function clampDist(d) { return clamp(d, 3.2 * YARD, 52 * YARD); }
function cam3d(me) {
  const t = lookTarget(me);
  const yaw = t.yaw0 + eye.yaw;
  const pitch = clampPitch(eye.pitch);
  const dist = clampDist(eye.dist);
  const fx = Math.sin(yaw) * Math.cos(pitch);
  const fy = Math.sin(pitch);
  const fz = Math.cos(yaw) * Math.cos(pitch);
  const ux = -Math.sin(yaw) * Math.sin(pitch);
  const uy = Math.cos(pitch);
  const uz = -Math.cos(yaw) * Math.sin(pitch);
  const rx = fy * uz - fz * uy;
  const ry = fz * ux - fx * uz;
  const rz = fx * uy - fy * ux;
  return {
    cx: t.ax - fx * dist,
    cy: Math.max(1.2 * YARD, -fy * dist),
    cz: t.az - fz * dist,
    fx: fx, fy: fy, fz: fz, rx: rx, ry: ry, rz: rz, ux: ux, uy: uy, uz: uz,
    yaw: yaw, pitch: pitch, dist: dist, fov: 0.84
  };
}

function proj3d(c, x, y, z, w, h) {
  const dx = x - c.cx, dy = y - c.cy, dz = z - c.cz;
  const f = dx * c.fx + dy * c.fy + dz * c.fz;
  if (f < 8) return null;
  const r = dx * c.rx + dy * c.ry + dz * c.rz;
  const u = dx * c.ux + dy * c.uy + dz * c.uz;
  const s = c.fov * (h * 0.52) / f;
  return { x: w / 2 + r * s, y: h * 0.5 - u * s, f: f, s: s };
}

function size3d() {
  const box = view3d.parentElement.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(1, Math.round(box.width * dpr));
  const h = Math.max(1, Math.round(box.height * dpr));
  if (view3d.width !== w) view3d.width = w;
  if (view3d.height !== h) view3d.height = h;
}

function paint3d() {
  if (!use3d()) { document.body.classList.remove('view-3d'); return; }
  document.body.classList.add('view-3d');
  const play = S.sess ? sessPlay() : cur();
  if (play) draw3d(play, S.snapT || 0);
}

function draw3d(play, t) {
  size3d();
  const ctx = view3d.getContext('2d');
  const w = view3d.width, h = view3d.height;
  const me0 = camPlayer(play);
  if (!me0) return;
  const mePos = atPath(jobOf(me0) || [{ x: me0.x, y: me0.y }], t) || me0;
  const me = { x: mePos.x, y: mePos.y, side: me0.side, id: me0.id, label: me0.label };
  const cam = cam3d(me);

  ctx.fillStyle = '#6eb7e0';
  ctx.fillRect(0, 0, w, h);
  fillField3d(ctx, cam, w, h);

  for (let k = -6; k <= 42; k++) {
    const z = LOS - k * YARD;
    const a = proj3d(cam, 30, 0, z, w, h), b = proj3d(cam, 870, 0, z, w, h);
    if (!a || !b) continue;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    if (k === 0) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; }
    else if (k % 5 === 0) { ctx.strokeStyle = 'rgba(234,240,232,0.5)'; ctx.lineWidth = 1.6; }
    else { ctx.strokeStyle = 'rgba(234,240,232,0.12)'; ctx.lineWidth = 1; }
    ctx.stroke();
    if (k > 0 && k % 5 === 0) {
      ctx.fillStyle = 'rgba(234,240,232,0.6)';
      ctx.font = Math.max(11, Math.round(h / 42)) + 'px sans-serif';
      ctx.fillText(String(k), a.x + 8, a.y - 4);
    }
  }
  [30, 870].forEach(x => {
    const a = proj3d(cam, x, 0, 40, w, h), b = proj3d(cam, x, 0, H - 40, w, h);
    if (!a || !b) return;
    ctx.strokeStyle = 'rgba(234,240,232,0.75)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  });

  play.players.forEach(p => {
    const path = jobOf(p);
    if (!path || path.length < 2) return;
    ctx.beginPath();
    let started = false;
    path.forEach(q => {
      const pr = proj3d(cam, q.x, 0.4, q.y, w, h);
      if (!pr) return;
      if (!started) { ctx.moveTo(pr.x, pr.y); started = true; }
      else ctx.lineTo(pr.x, pr.y);
    });
    if (!started) return;
    ctx.strokeStyle = isMyPlayer(p) ? 'rgba(242,194,48,0.85)' : 'rgba(242,194,48,0.28)';
    ctx.lineWidth = isMyPlayer(p) ? 4 : 2;
    ctx.stroke();
  });

  const sprites = play.players.map(p => {
    const pos = atPath(jobOf(p) || [{ x: p.x, y: p.y }], t) || p;
    const pr = proj3d(cam, pos.x, 0, pos.y, w, h);
    return { p: p, pos: pos, pr: pr };
  }).filter(s => s.pr).sort((a, b) => b.pr.f - a.pr.f);

  sprites.forEach(s => drawMan3d(ctx, s.p, s.pr, isMyPlayer(s.p) || s.p.id === me.id, cam, s.pos));
}

function fillField3d(ctx, cam, w, h) {
  const ring = [];
  for (let x = 30; x <= 870; x += 40) ring.push([x, 20]);
  for (let z = 20; z <= H - 20; z += 40) ring.push([870, z]);
  for (let x = 870; x >= 30; x -= 40) ring.push([x, H - 20]);
  for (let z = H - 20; z >= 20; z -= 40) ring.push([30, z]);
  const pts = ring.map(q => proj3d(cam, q[0], 0, q[1], w, h)).filter(Boolean);
  if (pts.length < 4) {
    ctx.fillStyle = '#1d4a32';
    ctx.fillRect(0, 0, w, h);
    return;
  }
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  pts.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.closePath();
  ctx.fillStyle = '#2d6a44';
  ctx.fill();
  for (let k = -8; k <= 46; k += 10) {
    const z0 = LOS - k * YARD, z1 = LOS - (k + 5) * YARD;
    const a = proj3d(cam, 30, 0, z0, w, h), b = proj3d(cam, 870, 0, z0, w, h);
    const c = proj3d(cam, 870, 0, z1, w, h), d = proj3d(cam, 30, 0, z1, w, h);
    if (!a || !b || !c || !d) continue;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y);
    ctx.closePath();
    ctx.fillStyle = 'rgba(22,53,37,0.28)';
    ctx.fill();
  }
}

function kitOf(p, cam, pos) {
  const team = p.side === 'def' ? 'blue' : 'white';
  const face = p.side === 'def' ? 1 : -1;
  const front = (cam.cz - pos.y) * face > 0;
  return KITS[team + '-' + (front ? 'front' : 'back')];
}
function drawMan3d(ctx, p, pr, self, cam, pos) {
  const x = pr.x, y = pr.y;
  const def = p.side === 'def';
  const fog = clamp(1.15 - pr.f / (90 * YARD), 0.2, 1);
  const img = kitOf(p, cam, pos);
  const ready = img && img.complete && img.naturalWidth;
  const ht = (ready ? 2.35 : 1.9) * YARD * pr.s;
  const wd = ready ? ht * (img.naturalWidth / img.naturalHeight) : 0.72 * YARD * pr.s;
  ctx.save();
  ctx.globalAlpha = (p.scout ? 0.55 : 1) * fog;
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath(); ctx.ellipse(x, y, wd * 0.38, Math.max(2, wd * 0.12), 0, 0, Math.PI * 2); ctx.fill();
  if (ready) {
    ctx.drawImage(img, x - wd / 2, y - ht, wd, ht);
  } else {
    ctx.fillStyle = def ? '#1b2d3a' : '#dedede';
    ctx.fillRect(x - wd * 0.22, y - ht * 0.55, wd * 0.44, ht * 0.55);
    ctx.fillStyle = def ? '#2c4d64' : '#f3f1ea';
    ctx.fillRect(x - wd * 0.38, y - ht * 0.9, wd * 0.76, ht * 0.4);
    ctx.beginPath();
    ctx.fillStyle = '#e4c39a';
    ctx.arc(x, y - ht * 0.98, wd * 0.26, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle = def ? '#22394a' : '#b03a2e';
    ctx.arc(x, y - ht * 1.02, wd * 0.3, Math.PI, 0);
    ctx.fill();
  }
  if (self) {
    ctx.strokeStyle = '#f2c230';
    ctx.lineWidth = Math.max(2, wd * 0.06);
    ctx.strokeRect(x - wd * 0.42, y - ht * 1.02, wd * 0.84, ht * 1.04);
  }
  ctx.font = 'bold ' + Math.max(11, Math.round(wd * 0.28)) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, wd * 0.08);
  ctx.strokeStyle = 'rgba(10,16,22,0.85)';
  ctx.fillStyle = self ? '#f2c230' : '#f7f4ee';
  ctx.strokeText(p.label, x, y - ht - 4);
  ctx.fillText(p.label, x, y - ht - 4);
  ctx.restore();
}
function applyCam() {
  const vw = W / cam.z, vh = H / cam.z;
  cam.x = clamp(cam.x, 0, Math.max(0, W - vw));
  cam.y = clamp(cam.y, 0, Math.max(0, H - vh));
  field.setAttribute('viewBox', cam.x + ' ' + cam.y + ' ' + vw + ' ' + vh);
}
function zoomAtCenter(factor) {
  const box = $('#fieldwrap').getBoundingClientRect();
  const cx = box.left + box.width / 2;
  const cy = box.top + box.height / 2;
  const z0 = cam.z;
  const z = clamp(z0 * factor, 1, 5);
  if (z === z0) return;
  const f0 = clientToView(cx, cy);
  cam.z = z;
  applyCam();
  const now = clientToView(cx, cy);
  cam.x += f0.x - now.x;
  cam.y += f0.y - now.y;
  applyCam();
}
function bumpZoom(dir) {
  if (use3d()) {
    eye.dist = clampDist(eye.dist * (dir > 0 ? 0.78 : 1.28));
    paint3d();
    return;
  }
  zoomAtCenter(dir > 0 ? 1.22 : 1 / 1.22);
}
function clientToView(cx, cy) {
  const pt = field.createSVGPoint();
  pt.x = cx; pt.y = cy;
  const m = field.getScreenCTM();
  if (!m) return { x: cam.x, y: cam.y };
  const p = pt.matrixTransform(m.inverse());
  return { x: p.x, y: p.y };
}
function worldToView(x, y) {
  return viewFlipped() ? { x: W - x, y: H - y } : { x: x, y: y };
}
function panBy(ax, ay, bx, by) {
  const a = clientToView(ax, ay);
  const b = clientToView(bx, by);
  cam.x += a.x - b.x;
  cam.y += a.y - b.y;
  applyCam();
}
function beginPan(e) {
  try { field.setPointerCapture(e.pointerId); } catch (err) {}
  act = { type: 'pan', last: { x: e.clientX, y: e.clientY } };
}
function panMove(e) {
  if (!act || act.type !== 'pan') return;
  panBy(act.last.x, act.last.y, e.clientX, e.clientY);
  act.last = { x: e.clientX, y: e.clientY };
}
function beginZoom() {
  const two = Array.from(screens.values()).slice(0, 2);
  if (two.length < 2) return;
  const mid = { x: (two[0].x + two[1].x) / 2, y: (two[0].y + two[1].y) / 2 };
  act = { type: 'zoom',
    d0: Math.max(1, Math.hypot(two[0].x - two[1].x, two[0].y - two[1].y)),
    z0: cam.z, f0: clientToView(mid.x, mid.y) };
}
function zoomMove() {
  const two = Array.from(screens.values()).slice(0, 2);
  if (two.length < 2 || !act || act.type !== 'zoom') return;
  const d = Math.max(1, Math.hypot(two[0].x - two[1].x, two[0].y - two[1].y));
  cam.z = clamp(act.z0 * (d / act.d0), 1, 5);
  applyCam();
  const mid = { x: (two[0].x + two[1].x) / 2, y: (two[0].y + two[1].y) / 2 };
  const now = clientToView(mid.x, mid.y);
  cam.x += act.f0.x - now.x;
  cam.y += act.f0.y - now.y;
  applyCam();
}
function focusOn(x, y, z) {
  cam.z = clamp(z == null ? 2.2 : z, 1, 5);
  const vw = W / cam.z, vh = H / cam.z;
  const v = worldToView(x, y);
  cam.x = v.x - vw / 2;
  cam.y = v.y - vh * 0.62;
  applyCam();
}

const dOf = p => p.map((q, i) => (i ? 'L' : 'M') + q.x.toFixed(1) + ',' + q.y.toFixed(1)).join(' ');

function line(layer, pts, o) {
  o = o || {};
  if (!pts || pts.length < 2) return;
  layer.append(sv('path', { d: dOf(pts), fill: 'none',
    stroke: o.color || '#f2c230', 'stroke-width': o.w || 5,
    'stroke-linecap': 'round', 'stroke-linejoin': 'round',
    'stroke-dasharray': o.dash || 'none', opacity: o.op == null ? 1 : o.op,
    'marker-end': o.arrow ? 'url(#' + o.arrow + ')' : 'none' }));
}
function blockMark(layer, p) {
  const dir = p.y < LOS ? 1 : -1;      // defenders come downhill, blockers go upfield
  line(layer, [{ x: p.x, y: p.y }, { x: p.x, y: p.y + dir * 40 }],
    { color: '#f1f4ee', w: 3, op: .7, arrow: 'm-tee' });
}
function paintCall(name) {
  name = String(name || '').trim();
  if (!name || !L.call) return;
  const y = LOS - 37 * YARD;
  const t = sv('text', {
    x: W / 2, y: y, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
    fill: '#ffffff', 'font-size': 56, 'font-weight': 800, 'letter-spacing': '0.06em',
    'paint-order': 'stroke', stroke: 'rgba(16,27,35,0.55)', 'stroke-width': 10,
    'pointer-events': 'none', class: 'call'
  });
  t.textContent = name;
  L.call.append(t);
  const wide = t.getComputedTextLength();
  if (wide > 780) {
    const size = Math.max(28, 56 * 780 / wide);
    t.setAttribute('font-size', size);
    t.setAttribute('stroke-width', Math.max(5, size / 5.5));
  }
  if (viewFlipped()) t.setAttribute('transform', 'rotate(180 ' + (W / 2) + ' ' + y + ')');
}

function token(layer, p, o) {
  o = o || {};
  const g = sv('g', { 'data-pid': p.id });
  let op = o.op == null ? 1 : o.op;
  if (p.scout) op = Math.min(op, 0.4);
  if (p.side === 'def') {
    g.append(sv('rect', { x: p.x - R, y: p.y - R, width: R * 2, height: R * 2, rx: 5,
      fill: o.fill || '#22394a', stroke: '#f1f4ee', 'stroke-width': 3, opacity: op }));
  } else {
    g.append(sv('circle', { cx: p.x, cy: p.y, r: R, fill: o.fill || '#f1f4ee',
      stroke: o.stroke || '#101b23', 'stroke-width': 3, opacity: op }));
  }
  const t = sv('text', { x: p.x, y: p.y + 7, 'text-anchor': 'middle', 'font-size': 20,
    'font-weight': 750, 'pointer-events': 'none',
    fill: p.side === 'def' ? '#f1f4ee' : '#101b23', opacity: op });
  t.textContent = p.label; g.append(t);
  if (viewFlipped()) g.setAttribute('transform', 'rotate(180 ' + p.x + ' ' + p.y + ')');
  if (o.ring) g.append(sv('circle', { cx: p.x, cy: p.y, r: R + 11, fill: 'none',
    stroke: o.ring, 'stroke-width': 4, 'pointer-events': 'none', class: o.pulse ? 'pulse' : '' }));
  g.append(sv('circle', { cx: p.x, cy: p.y, r: R + 16, fill: 'transparent' })); // fat finger target
  layer.append(g);
}

function drawPhoto(play) {
  if (!play || !play.img || !play.imgT) return;
  const t = play.imgT;
  const im = sv('image', { x: t.x, y: t.y, width: t.w, height: t.h,
    opacity: play.imgOp == null ? 0.85 : play.imgOp, preserveAspectRatio: 'none' });
  im.setAttribute('href', play.img);
  im.setAttributeNS('http://www.w3.org/1999/xlink', 'href', play.img);
  L.photo.append(im);
}

// photos get shrunk hard before storing — a playbook of full-size snaps will not fit
function shrink(file, max, cb) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = function () {
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * k));
    c.height = Math.max(1, Math.round(img.height * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    let data = null;
    try { data = c.toDataURL('image/jpeg', 0.62); } catch (e) { data = null; }
    cb(data, c.width, c.height);
  };
  img.onerror = function () { URL.revokeObjectURL(url); cb(null); };
  img.src = url;
}

// drop the picture onto the field so most of it sits over the formation
function fitPhoto(play, iw, ih) {
  const w = 830, h = w * (ih / iw);
  play.imgT = { x: (W - w) / 2, y: clamp((H - h) / 2 + 90, -200, H - 80), w: w, h: h };
  play.imgOp = 0.85;
}

/* ---------------- render ---------------- */
function render() {
  dropPlayMenu();
  Object.keys(L).forEach(k => clr(L[k]));
  document.body.className = document.body.className
    .replace(/\bmode-\w+/g, '')
    .replace(/\s+/g, ' ').trim();

}
function head(a, b) { $('#ttl').textContent = a; $('#sub').textContent = b; }
function paint(play, showRoutes) {
  play.players.forEach(p => {
    if (S.hideScout && p.scout) return;
    const mine = isMyPlayer(p);
    if (showRoutes && p.route) line(L.trail, p.route, {
      color: '#f2c230', arrow: 'm-live',
      op: !S.pos || mine ? 1 : 0.22, w: mine ? 6 : 4
    });
    if (showRoutes && p.block) blockMark(L.trail, p);
  });
  play.players.forEach(p => {
    if (S.hideScout && p.scout) return;
    const mine = isMyPlayer(p);

      ring: mine ? '#f2c230' : null,
      op: p.scout ? 0.4 : (!S.pos || mine ? 1 : 0.4)
    });

}
function updateFieldBadge() {

  if (!b) return;
  const ball = (window.HWIQ.BALL || []).find(x => x.id === S.ballOn);
  const play = cur();
  const form = play && window.HWIQ.formationOf(play);
  const bits = [];
  if (ball) bits.push('Ball on ' + ball.label);
  if (form) bits.push(form);

function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}
const sideOf = p => p.side === 'def' ? 'def' : 'off';
function visiblePlays() {
  const pos = currentPos();
  const f = pos ? pos.side : (S.sideFilter || 'both');
  let list = f === 'both' ? S.plays : S.plays.filter(p => sideOf(p) === f);
  if (S.bookFilter && S.bookFilter !== 'all')
    list = list.filter(p => folderOf(p) === S.bookFilter);
  if (pos) list = list.filter(p => myJobs(p).length);
  return list;
}
function sessionPlays() {
  const seen = {};
  return visiblePlays().filter(p => {
    if ((S.pick || []).indexOf(p.id) < 0 || !myJobs(p).length) return false;
    if (seen[p.id]) return false;
    seen[p.id] = true;
    return true;
  });
}

function startSession() {
  const list = shuffle(sessionPlays());
  S.sess = { style: S.style, order: list, i: 0, tasks: [], t: 0, done: [],
    log: [], hint: 0, usedHint: false, result: null, trail: null,
    active: null, flash: false, showAnswer: false };
  S.dockOpen = false;
  window.HWIQ.bumpDayStreak(S);
  save();
  loadTasks();
  render();
}
function sessPlay() { return S.sess.order[S.sess.i]; }
function loadTasks() {
  const s = S.sess;
  const jobs = myJobs(sessPlay()).map(p => p.id);
  s.tasks = jobs.length ? shuffle(jobs).slice(0, 1) : [];
  s.t = 0; s.done = []; s.hint = 0; s.usedHint = false;
  s.result = null; s.trail = null; s.active = null; s.showAnswer = false;
  const me = sessPlay().players.find(p => p.id === s.tasks[0]) ||
    sessPlay().players.find(p => isMyPlayer(p));
  if (me) focusOn(me.x, me.y, 2.3);
}
function target() {
  const s = S.sess;
  const id = s.style === 'guided' ? s.tasks[s.t] : s.active;
  return id ? sessPlay().players.find(p => p.id === id) : null;
}

function practiceRun(d) {
  const s = S.sess, play = sessPlay(), tgt = target();
  const pos = currentPos();
  const path = jobOf(tgt);
  head(play.name, 'Play ' + (s.i + 1) + ' of ' + s.order.length + ' \u00b7 ' +
    (pos ? pos.name : (sideOf(play) === 'def' ? 'Defense' : 'Offense')) + ' \u00b7 ' + play.type);

  // --- hints and answer on the field ---
  if (tgt && path) {
    if (s.hint >= 3 || s.showAnswer) {
      line(L.hint, path, { color: '#5fb0f0', dash: '12 9', op: .9, arrow: 'm-ans' });
    } else if (s.hint === 2 && s.flash) {
      line(L.hint, path, { color: '#5fb0f0', dash: '12 9', op: .9, arrow: 'm-ans' });
    } else if (s.hint === 1) {
      line(L.hint, resample(path, 20).slice(0, 5),
        { color: '#5fb0f0', dash: '10 8', op: .85, arrow: 'm-ans' });
    }
  }
  // --- routes already completed this play ---
  s.done.forEach(id => {
    const p = play.players.find(x => x.id === id);
    const donePath = jobOf(p);
    if (p && donePath) line(L.trail, donePath, { color: '#4fd189', op: .5, w: 4, arrow: 'm-pass' });
  });
  if (s.trail && tgt && path) paintTrail(L.trail, s.trail, path);

  play.players.forEach(p => {
    const isT = tgt && p.id === tgt.id;
    const doneAlready = s.done.indexOf(p.id) >= 0;
    const askable = s.tasks.indexOf(p.id) >= 0 && !doneAlready;
    token(L.token, p, {
      ring: isT ? '#f2c230' : doneAlready ? '#4fd189' : (isMyPlayer(p) ? '#f2c230' : null),
      pulse: isT && !s.result,
      op: s.style === 'guided' ? (isT || doneAlready ? 1 : .45)
                               : (askable || doneAlready ? 1 : .45)
    });
  });

  paintCall(play.name);

  const slim = !S.dockOpen;
  dockHandle(d);

  // --- dock ---
  if (s.result) {
    const r = s.result;
    const cls = r.pass ? (s.usedHint ? 'help' : 'pass') : 'fail';
    const word = r.pass ? (s.usedHint ? 'PASS \u00b7 with help' : 'PASS') : 'FAIL';
    d.append(el('div', { class: 'banner' }, [
      el('span', { class: 'verdict ' + cls, html: word }),
      el('div', { class: 'why', html: r.why +
        '<small>Got ' + Math.round((r.progress || 0) * 100) + '% of the way \u00b7 furthest off by ' +
        (r.worst / YARD).toFixed(1) + ' yd</small>' })
    ]));
  } else {
    const left = s.tasks.length - s.done.length;
    const job = sideOf(play) === 'def' ? 'assignment' : 'route';
    const cue = s.style === 'guided'
      ? 'Drag <b>' + (tgt ? tgt.label : '?') + '</b> through your ' + job + '.'
      : left + ' left. Press your player, then drag the ' + job + '.';
    d.append(el('div', { class: 'cue', html: cue }));
    if (!slim && s.hint >= 1 && tgt && path) d.append(el('p', { class: 'hint',
      html: describe(path, tgt.x, tgt.side === 'def') }));
  }

  const bar = el('div', { class: 'bar' });
  if (!s.result) {
    const h = el('button', { class: 'btn' });
    h.textContent = ['Hint', 'Show the shape', 'Leave it up', 'Route is up'][Math.min(s.hint, 3)];
    h.disabled = s.hint >= 3 || !tgt;
    h.onclick = useHint;
    const sk = el('button', { class: 'btn ghost' }); sk.textContent = 'Skip';
    sk.onclick = () => {
      s.usedHint = true; s.showAnswer = true;
      s.result = { pass: false, why: 'Skipped this one', coverage: 0, worst: 0 };
      const play = sessPlay();
      award('practice_rep', { playId: play && play.id, playName: play && play.name, pass: false, hint: true, skipped: true });
      render();
    };
    bar.append(h, sk);
  } else {
    const again = el('button', { class: 'btn' }); again.textContent = 'Run it again';
    again.onclick = () => { s.result = null; s.trail = null; s.showAnswer = false; render(); };
    const next = el('button', { class: 'btn go' });
    next.textContent = lastStep() ? 'Finish' : 'Next';
    next.onclick = advance;
    bar.append(again, next);
  }
  const quit = el('button', { class: 'btn ghost warn' }); quit.textContent = 'End';
  quit.onclick = () => { S.sess = null; S.dockOpen = false; render(); };
  bar.append(quit);
  d.append(bar);

  const more = moreBox();
  youBar(more);
  if (s.log.length) {
    const passed = s.log.filter(x => x.pass && !x.hint).length;
    more.append(el('p', { class: 'hint',
      html: passed + ' clean out of ' + s.log.length + ' so far.' }));
  }
  d.append(more);
}

// draws the finger trail green where it is on the route, red where it is not
function paintTrail(layer, trail, route) {
  const tol = tolPx();
  let run = [trail[0]], good = nearestOn(trail[0], route).d <= tol;
  const flush = () => line(layer, run, { color: good ? '#4fd189' : '#f2705e', w: 6, op: .95 });
  for (let i = 1; i < trail.length; i++) {
    const g = nearestOn(trail[i], route).d <= tol;
    run.push(trail[i]);
    if (g !== good) { flush(); run = [trail[i]]; good = g; }
  }
  flush();
}

function useHint() {
  const s = S.sess;
  s.hint = Math.min(3, s.hint + 1);
  s.usedHint = true;
  if (s.hint === 2) {
    s.flash = true; render();
    setTimeout(() => { if (S.sess === s) { s.flash = false; render(); } }, 1600);
    return;
  }
  render();
}

function lastStep() {
  return S.sess.i >= S.sess.order.length - 1;
}

function advance() {
  const s = S.sess, tgt = target();
  if (tgt && s.result) {
    s.log.push({ play: sessPlay().id, who: tgt.id, pass: s.result.pass, hint: s.usedHint });
    if (s.done.indexOf(tgt.id) < 0) s.done.push(tgt.id);
  }
  s.result = null; s.trail = null; s.hint = 0; s.usedHint = false;
  s.showAnswer = false; s.active = null;

  scorePlay(sessPlay().id);
  if (s.i >= s.order.length - 1) return finish();
  s.i++; loadTasks(); render();
}

function scorePlay(playId) {
  const mine = S.sess.log.filter(x => x.play === playId);
  const clean = mine.length > 0 && mine.every(x => x.pass && !x.hint);
  const st = S.stats[playId] || { reps: 0, passes: 0, streak: 0, learned: false };
  st.reps++;
  if (clean) { st.passes++; st.streak++; if (st.streak >= 3) st.learned = true; }
  else { st.streak = 0; st.learned = false; }
  S.stats[playId] = st; save();
}

function finish() {
  const log = S.sess.log.slice();
  S.sess = null;
  render();
  award('session_done', { clean: log.filter(x => x.pass && !x.hint).length, total: log.length });
  const d = $('#dock'); clr(d);
  const clean = log.filter(x => x.pass && !x.hint).length;
  const pct = Math.round(clean / (log.length || 1) * 100);
  head('Session done', (currentPos() ? currentPos().name + ' · ' : '') + clean + ' of ' + log.length + ' clean');
  youBar(d);
  d.append(el('div', { class: 'banner' }, [
    el('span', { class: 'verdict ' + (pct >= 80 ? 'pass' : pct >= 50 ? 'help' : 'fail'), html: pct + '%' }),
    el('div', { class: 'why', html: clean + ' routes run clean<small>' +
      (log.length - clean) + ' needed a hint or another go</small>' })
  ]));
  const weak = {};
  log.filter(x => !x.pass || x.hint).forEach(x => {
    const p = S.plays.find(y => y.id === x.play);
    const nm = p ? p.name : 'Unknown play';
    if (!weak[nm]) weak[nm] = [];
    if (weak[nm].indexOf(x.who) < 0) weak[nm].push(x.who);
  });
  const names = Object.keys(weak);
  if (names.length) {

function paintStep(play, t) {
  const movers = play.players.filter(p => jobOf(p) && !(S.hideScout && p.scout))
    .map(p => ({ p: p, pts: resample(jobOf(p), 70) }));
  clr(L.trail); clr(L.token);
  play.players.forEach(p => {
    if (S.hideScout && p.scout) return;
    if (p.block) blockMark(L.trail, p);
  });
  movers.forEach(m => {
    const n = Math.max(2, Math.round(t * (m.pts.length - 1)) + 1);
    const mine = isMyPlayer(m.p);
    line(L.trail, m.pts.slice(0, n), {
      color: '#f2c230', arrow: t >= 1 ? 'm-live' : null,
      op: !S.pos || mine ? 1 : 0.25, w: mine ? 6 : 4
    });
  });
  play.players.forEach(p => {
    if (S.hideScout && p.scout) return;
    const m = movers.find(q => q.p.id === p.id);
    const at = m ? m.pts[Math.round(t * (m.pts.length - 1))] : p;
    token(L.token, Object.assign({}, p, { x: at.x, y: at.y }), {
      ring: isMyPlayer(p) ? '#f2c230' : null,
      op: p.scout ? 0.4 : (!S.pos || isMyPlayer(p) ? 1 : 0.4)
    });
  });
}

function startQuiz(play) {
  const q = window.HWIQ.quizFor(play, currentPos());
  S.quiz = { playId: play.id, q: q, answered: null };
  S.mode = 'progress';
  render();
}

function animate(play, fromT) {
  if (anim) cancelAnimationFrame(anim);
  const start = clamp(fromT || 0, 0, 0.95);
  const movers = play.players.filter(p => jobOf(p) && !(S.hideScout && p.scout))
    .map(p => ({ p: p, pts: resample(jobOf(p), 70) }));
  const t0 = performance.now();
  const dur = snapDur() * (1 - start);
  const step = now => {
    const u = clamp((now - t0) / dur, 0, 1);
    const t = start + (1 - start) * u;
    S.snapT = t;
    if (use3d()) {
      draw3d(play, t);
      if (t >= 1) {
        anim = null;
        S.snapping = false;
        S.fieldMax = false;
        updateHud();
        document.body.classList.toggle('play-on', !!S.sess);
        document.body.classList.remove('snapping');
        return;
      }
      anim = requestAnimationFrame(step);
      return;
    }
    clr(L.trail); clr(L.token);
    play.players.forEach(p => {
      if (S.hideScout && p.scout) return;
      if (p.block) blockMark(L.trail, p);
    });
    movers.forEach(m => {
      const n = Math.max(2, Math.round(t * (m.pts.length - 1)) + 1);
      const mine = isMyPlayer(m.p);
      line(L.trail, m.pts.slice(0, n), {
        color: '#f2c230', arrow: t >= 1 ? 'm-live' : null,
        op: !S.pos || mine ? 1 : 0.25, w: mine ? 6 : 4
      });
    });
    play.players.forEach(p => {
      if (S.hideScout && p.scout) return;
      const m = movers.find(q => q.p.id === p.id);
      const at = m ? m.pts[Math.round(t * (m.pts.length - 1))] : p;
      token(L.token, Object.assign({}, p, { x: at.x, y: at.y }), {
        ring: isMyPlayer(p) ? '#f2c230' : null,
        op: p.scout ? 0.4 : (!S.pos || isMyPlayer(p) ? 1 : 0.4)
      });
    });
    anim = t < 1 ? requestAnimationFrame(step) : null;
  };
  anim = requestAnimationFrame(step);
}

function flipPlay(play) {
  play.players.forEach(p => {
    p.x = W - p.x;
    if (p.route) p.route = p.route.map(q => ({ x: W - q.x, y: q.y }));
  });
}

/* ============ typing routes in shorthand: "Z slant", "X out 12" ============ */
const ALIAS = { fly: 'go', streak: 'go', vert: 'go', dig: 'in', cross: 'drag',
  shallow: 'drag', stick: 'hitch', arrow: 'flat', swing: 'flat', sit: 'hitch',
  blitz: 'rush', thirds: 'third', halves: 'half', mid: 'middle',
  buzz: 'flatzone', curlflat: 'flatzone', deep: 'third' };
const DEPTHS = { go: 20, seam: 18, fade: 18, slant: 3, flat: 1, out: 8, in: 10,
  hitch: 6, curl: 10, comeback: 12, post: 12, corner: 12, drag: 3, wheel: 8, screen: 0,
  rush: 4, contain: 5, hook: 7, third: 14, half: 12, middle: 14, flatzone: 4, spy: 2 };
const DEF_WORDS = ['rush', 'blitz', 'contain', 'spy', 'hook', 'flatzone', 'third', 'half', 'middle'];
const ROUTE_WORDS = Object.keys(DEPTHS).concat(Object.keys(ALIAS)).concat(['block']);

function buildRoute(p, name, depth) {
  const Y = YARD, o = p.x >= W / 2 ? 1 : -1, i = -o;
  const D = depth || DEPTHS[name] || 8;
  const P = (dx, dy) => ({ x: clamp(p.x + dx * Y, 45, 855), y: p.y - dy * Y });
  switch (name) {
    case 'go':       return [P(0, 0), P(o * 0.5, D)];
    case 'seam':     return [P(0, 0), P(i * 1, D * 0.5), P(i * 1.5, D)];
    case 'fade':     return [P(0, 0), P(o * 1.5, D * 0.4), P(o * 3, D)];
    case 'slant':    return [P(0, 0), P(i * 1, 2), P(i * 8, 9)];
    case 'flat':     return [P(0, 0), P(o * 3, -1), P(o * 9, -0.5)];
    case 'out':      return [P(0, 0), P(0, D), P(o * 7, D - 1)];
    case 'in':       return [P(0, 0), P(0, D), P(i * 9, D + 0.5)];
    case 'hitch':    return [P(0, 0), P(0, D), P(i * 1.5, D - 2)];
    case 'curl':     return [P(0, 0), P(0, D), P(i * 2, D - 2.5)];
    case 'comeback': return [P(0, 0), P(0, D), P(o * 2.5, D - 3)];
    case 'post':     return [P(0, 0), P(0, D), P(i * 10, D + 11)];
    case 'corner':   return [P(0, 0), P(0, D), P(o * 9, D + 9)];
    case 'drag':     return [P(0, 0), P(i * 2, 2), P(i * 16, 4)];
    case 'wheel':    return [P(0, 0), P(o * 4, -1), P(o * 7, 3), P(o * 7.5, D + 4)];
    case 'screen':   return [P(0, 0), P(o * 5, -2), P(o * 10, -1)];
    // defence: positive depth means dropping away from the ball, negative means downhill
    case 'rush':     return [P(0, 0), P(o * 0.4, -D)];
    case 'contain':  return [P(0, 0), P(o * 2, -2), P(o * 3.2, -D)];
    case 'spy':      return [P(0, 0), P(i * 1.5, -1), P(o * 1.5, -1.5)];
    case 'hook':     return [P(0, 0), P(i * 0.4, D * 0.6), P(i * 1, D)];
    case 'flatzone': return [P(0, 0), P(o * 2, -2), P(o * 5.5, -4)];
    case 'third':    return [P(0, 0), P(o * 0.5, D * 0.4), P(o * 1.5, D)];
    case 'half':     return [P(0, 0), P(i * 3, D * 0.5), P(i * 5.5, D)];
    case 'middle':   return [P(0, 0), P(0, D * 0.4), P(0, D)];
    default: return null;
  }
}

// reads lines like "Z slant", "X: out 12", "TE block". First line can be the play name.
function applySheet(text, play) {
  const lines = String(text).split('\n').map(l => l.trim()).filter(Boolean);
  let done = 0; const skipped = [];
  lines.forEach((ln, idx) => {
    const m = ln.match(/^([A-Za-z][A-Za-z0-9]{0,3})\s*[:\-]?\s+([A-Za-z]+)\s*(\d+)?$/);
    const who = m ? play.players.find(q => !q.scout && q.label.toLowerCase() === m[1].toLowerCase()) : null;
    let word = m ? m[2].toLowerCase() : '';
    if (ALIAS[word]) word = ALIAS[word];
    if (!m || !who || ROUTE_WORDS.indexOf(m[2].toLowerCase()) < 0) {
      if (idx === 0 && !who) { play.name = ln; return; }
      skipped.push(ln); return;
    }
    if (word === 'block') { who.block = true; who.route = null; done++; return; }
    const r = buildRoute(who, word, m[3] ? +m[3] : 0);
    if (!r) { skipped.push(ln); return; }
    who.route = r; who.block = false; done++;
  });
  return { done: done, skipped: skipped };
}

function scalePhoto(play, k) {
  const t = play.imgT;
  const cx = t.x + t.w / 2, cy = t.y + t.h / 2;
  t.w *= k; t.h *= k;
  t.x = cx - t.w / 2; t.y = cy - t.h / 2;
}

    S.uploadMsg = 'Reading ' + files.length + ' picture' + (files.length === 1 ? '' : 's') + '…';
    render();
    files.forEach(f => {
      shrink(f, 1000, (data, iw, ih) => {

            ? 'Added ' + made + ' play' + (made === 1 ? '' : 's') +

// accepts the v1 landscape format as well as the current one
function normalise(raw) {
  const list = Array.isArray(raw) ? raw : raw.plays;
  if (!Array.isArray(list) || !list.length) throw new Error('no plays');
  let maxY = 0;
  list.forEach(p => (p.players || []).forEach(q => {
    if (+q.y > maxY) maxY = +q.y;
    (q.route || []).forEach(r => {
      const ry = +(r.y !== undefined ? r.y : r[1]);
      if (ry > maxY) maxY = ry;
    });
  }));
  const legacy = maxY > 0 && maxY < 760;   // old landscape format
  return list.map(p => {
    if (!Array.isArray(p.players) || !p.players.length) throw new Error('a play has no players');
    const out = {
      id: uid(),
      name: String(p.name || 'Untitled'),
      type: p.type || 'Pass',
      notes: p.notes || '',
      side: p.side === 'def' ? 'def' : 'off',
      folder: p.folder ? String(p.folder) : undefined,
      img: typeof p.img === 'string' && p.img.slice(0, 5) === 'data:' ? p.img : undefined,
      imgT: p.imgT && isFinite(+p.imgT.w) ? { x: +p.imgT.x, y: +p.imgT.y, w: +p.imgT.w, h: +p.imgT.h } : undefined,
      imgOp: isFinite(+p.imgOp) ? +p.imgOp : undefined,
      players: p.players.map(q => {
        const rt = Array.isArray(q.route) && q.route.length > 1
          ? q.route.map(r => ({ x: +(r.x !== undefined ? r.x : r[0]), y: +(r.y !== undefined ? r.y : r[1]) }))
          : null;
        return { id: String(q.id || q.label || uid()), label: String(q.label || q.id || '?'),
          x: +q.x, y: +q.y, side: q.side === 'def' ? 'def' : 'off',
          scout: !!q.scout, block: !!q.block, route: rt };
      })
    };
    if (legacy) {
      const conv = v => ({ x: (v.x - 500) * 0.9 + 450, y: 880 + (v.y - 450) * 0.9 });
      out.players.forEach(q => {
        const c = conv(q); q.x = c.x; q.y = c.y;
        if (q.route) q.route = q.route.map(conv);
      });
    }
    out.players.forEach(q => {
      if (!isFinite(q.x) || !isFinite(q.y)) throw new Error('bad coordinates');
    });
    return out;
  });
}

function ingest(text, replace) {
  try {
    const plays = normalise(JSON.parse(text));
    S.plays = replace ? plays : S.plays.concat(plays);
    if (replace) S.stats = {};
    S.pick = null;
    S.loadingPlays = false;
    S.currentId = plays[0].id;
    S.loadMsg = 'Loaded ' + plays.length + ' play' + (plays.length === 1 ? '' : 's') + '.';
    save(); render();
  } catch (e) {
    S.loadMsg = 'That did not read as a playbook. It needs a "plays" list, and each play needs "players" with x, y and an optional "route".';
    render();
  }
}
function pickFile() {
  const i = el('input', { type: 'file', accept: '.json,application/json' });
  i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => ingest(String(rd.result), false);
    rd.readAsText(f);
  };
  i.click();
}
function exportFile() {
  const blob = new Blob([JSON.stringify({ plays: S.plays, stats: S.stats }, null, 2)],
    { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: 'playbook.json' });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ===================== finger input ===================== */
function toField(e) {
  const pt = field.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const m = (worldG || field).getScreenCTM();
  if (!m) return { x: 0, y: 0 };
  const p = pt.matrixTransform(m.inverse());
  return { x: clamp(p.x, 0, W), y: clamp(p.y, 0, H) };
}
let act = null;
const pointers = new Map();   // live fingers, so the picture can be pinched
const screens = new Map();    // client coords for field pinch-zoom

field.addEventListener('pointerdown', e => {
  if (!S.pos || S.pickingPos || S.loadingPlays) return;
  e.preventDefault();
  screens.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const pos = toField(e);
  pointers.set(e.pointerId, pos);
  const photoTool = S.mode === 'plays' && S.pane === 'list' && S.tool === 'photo';
  if (screens.size >= 2 && !photoTool) {
    if (act && act.type === 'draw') { act = null; clr(L.live); }
    beginZoom();
    return;
  }
  const hit = e.target.closest('[data-pid]');
  const pid = hit ? hit.getAttribute('data-pid') : null;
  if (photoTool) return photoDown(e, pos);
  if (S.mode === 'plays' && S.pane === 'list') return editDown(e, pos, pid);
  if (S.mode === 'practice' && S.sess) return runDown(e, pos, pid);
  beginPan(e);
});

function photoDown(e, pos) {
  const play = cur();
  if (!play || !play.img || !play.imgT) return;
  try { field.setPointerCapture(e.pointerId); } catch (err) {}
  if (pointers.size >= 2) {
    const two = Array.from(pointers.values()).slice(0, 2);
    act = { type: 'photo', mode: 'pinch', play: play,
      d0: Math.max(1, dist(two[0], two[1])),
      mid0: { x: (two[0].x + two[1].x) / 2, y: (two[0].y + two[1].y) / 2 },
      rect0: Object.assign({}, play.imgT) };
  } else {
    act = { type: 'photo', mode: 'move', play: play, last: pos };
  }
}

function photoMove() {
  const t = act.play.imgT;
  if (act.mode === 'pinch') {
    const two = Array.from(pointers.values()).slice(0, 2);
    if (two.length < 2) return;
    const k = clamp(dist(two[0], two[1]) / act.d0, 0.15, 8);
    const mid = { x: (two[0].x + two[1].x) / 2, y: (two[0].y + two[1].y) / 2 };
    t.w = act.rect0.w * k;
    t.h = act.rect0.h * k;
    t.x = mid.x - (act.mid0.x - act.rect0.x) * k;
    t.y = mid.y - (act.mid0.y - act.rect0.y) * k;
  } else {
    const now = pointers.values().next().value;
    if (!now) return;
    t.x += now.x - act.last.x;
    t.y += now.y - act.last.y;
    act.last = now;
  }
  render();
}

field.addEventListener('pointermove', e => {
  if (screens.has(e.pointerId)) screens.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!act) return;
  const pos = toField(e);
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, pos);
  if (act.type === 'zoom') { zoomMove(); return; }
  if (act.type === 'pan') { panMove(e); return; }
  if (act.type === 'photo') { photoMove(); return; }
  if (act.type === 'drag') {
    act.p.x = pos.x + act.dx; act.p.y = pos.y + act.dy;
    render();
    return;
  }
  const last = act.pts[act.pts.length - 1];
  if (dist(last, pos) < 7) return;
  act.pts.push(pos);
  clr(L.live);
  if (act.mode === 'run') {
    paintTrail(L.live, act.pts, act.path || act.p.route);
    token(L.live, Object.assign({}, act.p, { x: pos.x, y: pos.y }), { stroke: '#f2c230' });
  } else {
    line(L.live, act.pts, { color: '#f2c230', w: 5 });
  }
});

field.addEventListener('pointerup', e => {
  pointers.delete(e.pointerId);
  screens.delete(e.pointerId);
  if (!act) return;
  if (act.type === 'zoom') {
    if (screens.size < 2) act = null;
    return;
  }
  if (act.type === 'pan') { act = null; return; }
  if (act.type === 'photo') { act = null; save(); render(); return; }
  const a = act; act = null;
  try { field.releasePointerCapture(e.pointerId); } catch (err) {}
  clr(L.live);
  if (a.type === 'draw') {
    if (a.pts.length > 2) {
      if (a.mode === 'edit') { a.p.route = thin(a.pts); a.p.block = false; }
      else {
        const s = S.sess;
        s.trail = a.pts;
        s.result = judge(a.pts, a.path || a.p.route, tolPx());
        if (!s.result.pass) s.showAnswer = true;
        const play = sessPlay();
        award('practice_rep', {
          playId: play && play.id, playName: play && play.name,
          pass: s.result.pass, hint: s.usedHint, skipped: false
        });
      }
    } else if (a.mode === 'run') {
      S.sess.trail = null; S.sess.active = null;
    }
  }
  save(); render();
});
field.addEventListener('pointercancel', e => {
  pointers.delete(e.pointerId);
  screens.delete(e.pointerId);
  act = null; clr(L.live); render();
});

function thin(pts, tol) {
  tol = tol || 10;
  const out = [pts[0]];
  for (let i = 0; i < pts.length; i++)
    if (dist(pts[i], out[out.length - 1]) > tol) out.push(pts[i]);
  const last = pts[pts.length - 1];
  if (dist(last, out[out.length - 1]) > 1) out.push(last);
  return out;
}

function editDown(e, pos, pid) {
  const play = cur(); if (!play) return;
  if (S.tool === 'add' && S.armed) {
    let label = S.armed.label, n = 2;
    while (play.players.some(p => p.id === label)) label = S.armed.label + (n++);
    play.players.push({ id: label, label: label, x: pos.x, y: pos.y,
      side: S.armed.side, block: false, route: null });
    S.sel = label; S.armed = null; S.tool = 'move'; save(); render();
    return;
  }
  if (!pid) { S.sel = null; render(); return; }
  const p = play.players.find(x => x.id === pid);
  if (!p) return;
  S.sel = pid;
  act = S.tool === 'route'
    ? { type: 'draw', mode: 'edit', p: p, pts: [{ x: p.x, y: p.y }] }
    : { type: 'drag', p: p, dx: p.x - pos.x, dy: p.y - pos.y };
  try { field.setPointerCapture(e.pointerId); } catch (err) {}
  render();
}

function runDown(e, pos, pid) {
  const s = S.sess, play = sessPlay();
  if (s.result) { beginPan(e); return; }
  let p;
  if (s.style === 'guided') {
    p = play.players.find(x => x.id === s.tasks[s.t]);
    if (!p) { beginPan(e); return; }
    if (pid !== p.id && dist(pos, p) > R + 24) { beginPan(e); return; }
  } else {
    if (!pid) { beginPan(e); return; }
    p = play.players.find(x => x.id === pid);
    if (!p) { beginPan(e); return; }
    if (s.done.indexOf(pid) >= 0) { bump(p.label + ' is already done.'); beginPan(e); return; }
    if (s.tasks.indexOf(pid) < 0) {
      const you = currentPos();
      bump(p.scout ? 'That is the other side of the ball. Pick your player.'
                   : you ? 'That is not the ' + you.name.toLowerCase() + '. Start on your player.'
                         : p.label + ' has no assignment here — he rushes or blocks.');
      beginPan(e);
      return;
    }
    s.active = pid;
  }
  act = { type: 'draw', mode: 'run', p: p, pts: [{ x: p.x, y: p.y }], path: jobOf(p) };
  try { field.setPointerCapture(e.pointerId); } catch (err) {}
  render();
}

function bump(msg) {
  const c = $('#dock').querySelector('.cue');
  if (c) c.innerHTML = msg;
}

/* ===================== boot ===================== */
document.querySelectorAll('.tabs button').forEach(b => {
  b.onclick = () => {
    const next = b.getAttribute('data-mode');
    S.mode = next;
    S.sel = null; S.armed = null; S.loadMsg = '';
    if (next !== 'progress') S.quiz = null;
    if (next === 'study' && window.innerWidth >= 900 && (S.dockW || 0) < 440) {
      S.dockW = 440; applyDockWidth(); save();
    }
    render();
    const play = cur();
    if (next === 'study' && play) award('study_view', { playId: play.id, playName: play.name });
  };
});
$('#back').onclick = goBack;
$('#account').onclick = () => { mountBoard(); };
$('#signout').onclick = () => { Account.logout(); };
$('#streak').onclick = () => { S.mode = 'progress'; render(); };
$('#recenter').onclick = () => {
  resetEye();
  if (!anim) S.snapT = 0;
  paint3d();
};
$('#zoom-in').onclick = () => bumpZoom(1);
$('#zoom-out').onclick = () => bumpZoom(-1);
$('#zoom').addEventListener('pointerdown', e => e.stopPropagation());
$('#viewmode').addEventListener('pointerdown', e => e.stopPropagation());
document.addEventListener('pointerdown', e => {
  if (!S.playMenu) return;
  const menu = $('#play-menu');
  const btn = document.querySelector('.change-play');
  if (menu && menu.contains(e.target)) return;
  if (btn && btn.contains(e.target)) return;
  closePlayMenu();
}, true);
$('#hud').addEventListener('wheel', e => e.stopPropagation(), { passive: false });
$('#hud').addEventListener('pointerdown', e => e.stopPropagation());
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    goBack();
    S.sel = null; S.armed = null; act = null; clr(L.live);
    return;
  }
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === '/' && S.mode === 'study') {
    e.preventDefault();
    const inp = $('#study-search') || $('#dock input[type=search]');
    if (inp) inp.focus();
    return;
  }
  if (S.mode !== 'study' && S.mode !== 'practice') return;
  if (e.key === 'n' || e.key === 'N') { stepPlay(1); return; }
  if (e.key === 'p' || e.key === 'P') { stepPlay(-1); return; }
  if (e.key === 'f' || e.key === 'F') { const pl = cur(); if (pl) toggleFav(pl.id); return; }
  if (e.key === 'o' || e.key === 'O') { S.hideScout = !S.hideScout; render(); return; }
  if (e.key === 's' || e.key === 'S') { S.stepMode = !S.stepMode; S.stepT = 0; render(); return; }
  if (e.key === ' ' && S.mode === 'study') {
    e.preventDefault();
    const play = cur();
    if (!play) return;
    S.fieldMax = true; S.dockOpen = false; render();
    animate(play, S.stepMode ? S.stepT : 0);
    award('study_run', { playId: play.id, playName: play.name });
    return;
  }
  if (e.key >= '1' && e.key <= '4') {
    S.playSpeed = [0.5, 1, 2, 3][Number(e.key) - 1];
    save(); if (S.mode === 'study') render(); else updateHud();
  }
});
document.addEventListener('gesturestart', e => e.preventDefault());
$('#fieldwrap').addEventListener('wheel', e => {
  e.preventDefault();
  if (use3d()) {
    eye.dist = clampDist(eye.dist * (e.deltaY > 0 ? 1.08 : 0.92));
    paint3d();
    return;
  }
  const z0 = cam.z;
  const z = clamp(z0 * (e.deltaY > 0 ? 0.9 : 1.1), 1, 5);
  if (z === z0) return;
  const f0 = clientToView(e.clientX, e.clientY);
  cam.z = z;
  applyCam();
  const fMid = clientToView(e.clientX, e.clientY);
  cam.x += f0.x - fMid.x;
  cam.y += f0.y - fMid.y;
  applyCam();
}, { passive: false });

view3d.addEventListener('pointerdown', e => {
  if (!use3d()) return;
  e.preventDefault();
  screens.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (screens.size >= 2) {
    const two = Array.from(screens.values()).slice(0, 2);
    const mid = { x: (two[0].x + two[1].x) / 2, y: (two[0].y + two[1].y) / 2 };
    const play = S.sess ? sessPlay() : cur();
    const me = play && camPlayer(play);
    const yaw = (me ? lookTarget(me).yaw0 : 0) + eye.yaw;
    act = { type: 'lookz',
      d0: Math.max(1, Math.hypot(two[0].x - two[1].x, two[0].y - two[1].y)),
      dist0: eye.dist, mid0: mid, tx0: eye.tx || 0, ty0: eye.ty || 0, yaw: yaw };
    return;
  }
  try { view3d.setPointerCapture(e.pointerId); } catch (err) {}
  act = { type: 'look', last: { x: e.clientX, y: e.clientY } };
});
view3d.addEventListener('pointermove', e => {
  if (screens.has(e.pointerId)) screens.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!act) return;
  if (act.type === 'lookz') {
    const two = Array.from(screens.values()).slice(0, 2);
    if (two.length < 2) return;
    const d = Math.max(1, Math.hypot(two[0].x - two[1].x, two[0].y - two[1].y));
    eye.dist = clampDist(act.dist0 * (act.d0 / d));
    const mid = { x: (two[0].x + two[1].x) / 2, y: (two[0].y + two[1].y) / 2 };
    const dx = mid.x - act.mid0.x, dy = mid.y - act.mid0.y;
    const rx = Math.cos(act.yaw), rz = -Math.sin(act.yaw);
    const fx = Math.sin(act.yaw), fz = Math.cos(act.yaw);
    const k = eye.dist / 260;
    eye.tx = act.tx0 - (dx * rx + dy * fx) * k;
    eye.ty = act.ty0 - (dx * rz + dy * fz) * k;
    paint3d();
    return;
  }
  if (act.type !== 'look') return;
  eye.yaw -= (e.clientX - act.last.x) * 0.007;
  eye.pitch = clampPitch(eye.pitch - (e.clientY - act.last.y) * 0.006);
  act.last = { x: e.clientX, y: e.clientY };
  paint3d();
});
view3d.addEventListener('pointerup', e => {
  screens.delete(e.pointerId);
  if (act && (act.type === 'look' || act.type === 'lookz') && screens.size < 2) act = null;
});
view3d.addEventListener('pointercancel', e => {
  screens.delete(e.pointerId);
  if (act && (act.type === 'look' || act.type === 'lookz')) act = null;
});
let splitDrag = null;
const split = $('#split');
split.addEventListener('pointerdown', e => {
  if (!window.matchMedia('(min-width:900px)').matches || use3d()) return;
  e.preventDefault();
  try { split.setPointerCapture(e.pointerId); } catch (err) {}
  document.body.classList.add('resizing');
  splitDrag = { x: e.clientX, w: S.dockW || DOCK_DEFAULT };
});
split.addEventListener('pointermove', e => {
  if (!splitDrag) return;
  S.dockW = clampDock(splitDrag.w - (e.clientX - splitDrag.x));
  applyDockWidth();
  applyCam();
  if (use3d()) paint3d();
});
split.addEventListener('pointerup', e => {
  if (!splitDrag) return;
  splitDrag = null;
  document.body.classList.remove('resizing');
  try { split.releasePointerCapture(e.pointerId); } catch (err) {}
  save();
  applyCam();
  if (use3d()) paint3d();
});
split.addEventListener('pointercancel', () => {
  splitDrag = null;
  document.body.classList.remove('resizing');
});
split.addEventListener('dblclick', () => {
  S.dockW = DOCK_DEFAULT;
  applyDockWidth();
  save();
  applyCam();
});
window.addEventListener('resize', () => {
  applyDockWidth();
  applyCam();
  if (use3d()) paint3d();
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function () {});
}

initField();
applyDockWidth();
Account.boot('app').then(ok => {
  if (!ok) return;
  if (Account.me.branding && Account.me.branding.appName)
    $('#ttl').textContent = Account.me.branding.appName;
  render();
  updateAccountChip();
});
</script>
